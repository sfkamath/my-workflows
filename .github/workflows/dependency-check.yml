name: Dependency Check

on:
  workflow_call:
    inputs:
      project-name:
        type: string
        default: ${{ github.repository }}
      fail-on-cvss:
        type: number
        default: 0
      nvd_api_key:
        type: string
        required: false
        default: ''

jobs:
  dependency-check:
    name: OWASP Dependency Check
    runs-on:
      - self-hosted
      - linux
      - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Dependency Check
        run: |
          NVD_FLAG=""
          if [ -n "${{ inputs.nvd_api_key }}" ]; then
            NVD_FLAG="--nvdApiKey ${{ inputs.nvd_api_key }}"
          fi
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -v /home/sfk/odc-data:/usr/share/dependency-check/data \
            owasp/dependency-check:latest \
            --project "${{ inputs.project-name }}" \
            --scan /src \
            --noupdate \
            --format HTML \
            --output /tmp/dependency-check-${{ github.run_id }} \
            --failOnCVSS ${{ inputs.fail-on-cvss }} \
            $NVD_FLAG

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: /tmp/dependency-check-${{ github.run_id }}/dependency-check-report.html
          retention-days: 30
