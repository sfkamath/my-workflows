name: Sweep package versions

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report deletions without applying them
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: package-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Apply package retention policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sweep package versions
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SWEEP_TOKEN }}
        run: |
          args=(config/package-retention.json)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            args+=(--dry-run "${{ inputs.dry_run }}")
          fi
          scripts/package-sweep.sh "${args[@]}"
