name: Synchronize repository secrets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report secret updates without applying them
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: synchronize-repository-secrets
  cancel-in-progress: false

jobs:
  synchronize:
    name: Apply repository secret mappings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Synchronize secrets
        env:
          GH_TOKEN: ${{ secrets.SECRET_SYNC_TOKEN }}
          SECRET_VALUES_JSON: ${{ secrets.SECRET_VALUES_JSON }}
        run: |
          scripts/sync-secrets.sh \
            config/secret-targets.json \
            --dry-run "${{ inputs.dry_run }}"
